# Autumn Dark palette for Omarchy v4.
#
# Every themed app is generated from these colors by omarchy-theme-set-templates,
# so keep this file as the single source of truth. The `selection` pair drives
# selected rows/buttons and text selection; the ANSI names map to color0-15.

mode = "dark"

accent = "#a78854"
selection = "#a78854"
selection_foreground = "#343434"
muted = "#818181"

background = "#343434"
dark_background = "#272727"
darker_background = "#1a1a1a"
lighter_background = "#49433a"

foreground = "#cccccc"
dark_foreground = "#818181"
light_foreground = "#cccccc"
bright_foreground = "#cccccc"

red = "#af7150"
yellow = "#b47664"
orange = "#b47664"
green = "#8a766c"
cyan = "#b89268"
blue = "#a78854"
magenta = "#918775"
brown = "#5a3b32"

bright_red = "#c59981"
bright_yellow = "#cba095"
bright_green = "#ab9b92"
bright_cyan = "#d0b598"
bright_blue = "#c0a982"
bright_magenta = "#b1aa9c"
