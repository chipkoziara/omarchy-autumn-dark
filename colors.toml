mode = "dark"

accent = "#a78854"

# Selected-item colors. The theme is configured with Aether, whose GTK palette
# uses the accent as the selected background and the dark background as the
# selected foreground (theme_selected_bg_color / theme_selected_fg_color). These
# feed Gum's GUM_*_SELECTED_* vars, the terminal selection, and Helix.
